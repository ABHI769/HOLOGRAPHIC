<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="800" height="800" fill="#020617" rx="30" />

  <!-- Outer Tech Ring -->
  <circle cx="400" cy="400" r="340" fill="none" stroke="#0e7490" stroke-width="2" stroke-dasharray="10 20 40 20" opacity="0.6"/>
  <circle cx="400" cy="400" r="310" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="180 30 90 30" opacity="0.8" />
  <circle cx="400" cy="400" r="280" fill="none" stroke="#0891b2" stroke-width="1.5" />

  <!-- Radiating ticks -->
  <g stroke="#22d3ee" stroke-width="2" opacity="0.7">
    <line x1="400" y1="70" x2="400" y2="110" />
    <line x1="400" y1="690" x2="400" y2="730" />
    <line x1="70" y1="400" x2="110" y2="400" />
    <line x1="690" y1="400" x2="730" y2="400" />
    <line x1="166" y1="166" x2="195" y2="195" />
    <line x1="634" y1="166" x2="605" y2="195" />
    <line x1="166" y1="634" x2="195" y2="605" />
    <line x1="634" y1="634" x2="605" y2="605" />
  </g>

  <!-- Segments -->
  <g fill="none" stroke="url(#ringGrad)" stroke-width="8" filter="url(#neonBlur)">
    <path d="M 400 160 A 240 240 0 0 1 607 280" stroke-linecap="round" />
    <path d="M 640 400 A 240 240 0 0 1 520 607" stroke-linecap="round" />
    <path d="M 400 640 A 240 240 0 0 1 193 520" stroke-linecap="round" />
    <path d="M 160 400 A 240 240 0 0 1 280 193" stroke-linecap="round" />
  </g>

  <!-- Hexagonal Containment Grid -->
  <polygon points="400,220 555,310 555,490 400,580 245,490 245,310" fill="none" stroke="#22d3ee" stroke-width="2.5" opacity="0.8"/>
  <polygon points="400,250 530,325 530,475 400,550 270,475 270,325" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.5" stroke-dasharray="8 6"/>

  <!-- Rotor blades / Coils -->
  <g fill="#0e7490" opacity="0.6" stroke="#22d3ee" stroke-width="1.5">
    <path d="M 380 220 L 420 220 L 410 320 L 390 320 Z" />
    <path d="M 380 580 L 420 580 L 410 480 L 390 480 Z" />
    <path d="M 220 380 L 220 420 L 320 410 L 320 390 Z" />
    <path d="M 580 380 L 580 420 L 480 410 L 480 390 Z" />
  </g>

  <!-- Glowing Core -->
  <circle cx="400" cy="400" r="140" fill="url(#coreGlow)" />
  <circle cx="400" cy="400" r="80" fill="#00f0ff" opacity="0.5" filter="url(#neonBlur)"/>
  <circle cx="400" cy="400" r="50" fill="#ffffff" filter="url(#neonBlur)"/>

  <!-- Energy Wave Rings -->
  <circle cx="400" cy="400" r="110" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8" stroke-dasharray="15 35"/>
  <circle cx="400" cy="400" r="170" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.9" stroke-dasharray="40 10 20 10"/>

  <!-- Data text labels -->
  <text x="400" y="745" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14" letter-spacing="6" opacity="0.9">QUANTUM CORE REACTOR // 98.7% SYNC</text>
  <text x="400" y="65" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="12" letter-spacing="8" opacity="0.7">HARMONIC CONTAINMENT FIELD</text>
</svg>
