<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <filter id="cubeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#020617" rx="30" />

  <!-- Coordinate ticks and concentric circles -->
  <circle cx="400" cy="380" r="320" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.6"/>
  <circle cx="400" cy="380" r="260" fill="none" stroke="#155e75" stroke-width="1" stroke-dasharray="40 10 10 10" />

  <!-- Outer Isometric Cube -->
  <!-- Center: 400, 380 -->
  <g fill="none" stroke="#22d3ee" stroke-width="3" filter="url(#cubeGlow)">
    <!-- Top Face -->
    <polygon points="400,160 560,250 400,340 240,250" fill="#0891b2" fill-opacity="0.15" />
    <!-- Left Face -->
    <polygon points="240,250 400,340 400,530 240,440" fill="#0284c7" fill-opacity="0.2" />
    <!-- Right Face -->
    <polygon points="560,250 400,340 400,530 560,440" fill="#0369a1" fill-opacity="0.25" />
  </g>

  <!-- Inner Tesseract Hypercube -->
  <g fill="none" stroke="#a5f3fc" stroke-width="2" filter="url(#cubeGlow)">
    <!-- Inner Top Face -->
    <polygon points="400,270 480,315 400,360 320,315" fill="#38bdf8" fill-opacity="0.3" />
    <!-- Inner Left Face -->
    <polygon points="320,315 400,360 400,455 320,410" fill="#0284c7" fill-opacity="0.35" />
    <!-- Inner Right Face -->
    <polygon points="480,315 400,360 400,455 480,410" fill="#075985" fill-opacity="0.4" />
  </g>

  <!-- Tesseract Connecting Struts -->
  <g stroke="#ffffff" stroke-width="2.5" opacity="0.85" filter="url(#cubeGlow)">
    <line x1="400" y1="160" x2="400" y2="270" />
    <line x1="560" y1="250" x2="480" y2="315" />
    <line x1="240" y1="250" x2="320" y2="315" />
    <line x1="400" y1="340" x2="400" y2="360" />
    <line x1="240" y1="440" x2="320" y2="410" />
    <line x1="560" y1="440" x2="480" y2="410" />
    <line x1="400" y1="530" x2="400" y2="455" />
  </g>

  <!-- Vertex Energy Nodes -->
  <g fill="#ffffff" filter="url(#cubeGlow)">
    <circle cx="400" cy="160" r="5" />
    <circle cx="560" cy="250" r="5" />
    <circle cx="400" cy="340" r="5" />
    <circle cx="240" cy="250" r="5" />
    <circle cx="240" cy="440" r="5" />
    <circle cx="560" cy="440" r="5" />
    <circle cx="400" cy="530" r="5" />
    <circle cx="400" cy="270" r="4" />
    <circle cx="480" cy="315" r="4" />
    <circle cx="320" cy="315" r="4" />
    <circle cx="400" cy="455" r="4" />
    <circle cx="320" cy="410" r="4" />
    <circle cx="480" cy="410" r="4" />
  </g>

  <text x="400" y="720" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="14" letter-spacing="8">4D TESSERACT // TOPOLOGICAL MATRIX</text>
  <text x="400" y="745" text-anchor="middle" fill="#0284c7" font-family="monospace" font-size="11" letter-spacing="5">NON-EUCLIDEAN DIMENSIONAL FOLD</text>
</svg>
