<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#020617" rx="30" />

  <!-- Target Rings -->
  <circle cx="400" cy="380" r="330" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="12 18" opacity="0.5"/>
  <circle cx="400" cy="380" r="300" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="250 50 100 50" opacity="0.7"/>

  <!-- Helmet Plating / Outlines -->
  <g fill="#0f172a" stroke="#22d3ee" stroke-width="3" filter="url(#mGlow)">
    <!-- Crest / Horns -->
    <polygon points="400,100 430,220 400,200 370,220" fill="#0891b2"/>
    <polygon points="340,150 370,230 330,220" />
    <polygon points="460,150 430,230 470,220" />

    <!-- Helmet main crown -->
    <path d="M 260 270 L 330 200 L 470 200 L 540 270 L 550 400 L 520 540 L 400 620 L 280 540 L 250 400 Z" />

    <!-- Ear pods / communication modules -->
    <rect x="210" y="340" width="40" height="100" rx="8" fill="#0284c7"/>
    <rect x="550" y="340" width="40" height="100" rx="8" fill="#0284c7"/>
  </g>

  <!-- Visor -->
  <polygon points="270,350 530,350 500,430 400,450 300,430" fill="url(#visorGrad)" opacity="0.85" filter="url(#mGlow)"/>

  <!-- Visor HUD lines -->
  <line x1="280" y1="390" x2="520" y2="390" stroke="#020617" stroke-width="3" stroke-dasharray="20 10 40 10" />
  <circle cx="400" cy="390" r="14" fill="#020617" />
  <circle cx="400" cy="390" r="6" fill="#22d3ee" />

  <!-- Chin guard & breathers -->
  <polygon points="330,480 470,480 450,580 400,600 350,580" fill="#0369a1" stroke="#00f0ff" stroke-width="2"/>
  <line x1="360" y1="510" x2="440" y2="510" stroke="#22d3ee" stroke-width="2"/>
  <line x1="370" y1="530" x2="430" y2="530" stroke="#22d3ee" stroke-width="2"/>
  <line x1="380" y1="550" x2="420" y2="550" stroke="#22d3ee" stroke-width="2"/>

  <!-- Neck collar plates -->
  <path d="M 280 570 L 200 680 L 330 670 L 400 640 L 470 670 L 600 680 L 520 570" fill="none" stroke="#22d3ee" stroke-width="2.5"/>

  <!-- Status indicators -->
  <circle cx="230" cy="370" r="5" fill="#22c55e" filter="url(#mGlow)"/>
  <circle cx="230" cy="400" r="5" fill="#22d3ee" />
  <circle cx="570" cy="370" r="5" fill="#22c55e" filter="url(#mGlow)"/>
  <circle cx="570" cy="400" r="5" fill="#22d3ee" />

  <text x="400" y="730" text-anchor="middle" fill="#22d3ee" font-family="monospace" font-size="14" letter-spacing="8">TACTICAL MECHA AVATAR // UNIT-01</text>
  <text x="400" y="755" text-anchor="middle" fill="#06b6d4" font-family="monospace" font-size="11" letter-spacing="5">HUD INTERFACE: NEURAL LINK ONLINE</text>
</svg>
