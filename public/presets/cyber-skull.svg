<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="skullGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#020617" rx="30" />

  <!-- Background grid -->
  <g stroke="#083344" stroke-width="1" opacity="0.6">
    <line x1="100" y1="0" x2="100" y2="800" />
    <line x1="200" y1="0" x2="200" y2="800" />
    <line x1="300" y1="0" x2="300" y2="800" />
    <line x1="400" y1="0" x2="400" y2="800" />
    <line x1="500" y1="0" x2="500" y2="800" />
    <line x1="600" y1="0" x2="600" y2="800" />
    <line x1="700" y1="0" x2="700" y2="800" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    <line x1="0" y1="600" x2="800" y2="600" />
    <line x1="0" y1="700" x2="800" y2="700" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="400" cy="380" r="280" fill="url(#skullGlow)" />

  <!-- Cybernetic Cranium Outline -->
  <g fill="none" stroke="#22d3ee" stroke-width="3" filter="url(#glow)">
    <!-- Top dome -->
    <path d="M 230 380 C 210 240, 310 160, 400 160 C 490 160, 590 240, 570 380 C 565 415, 540 440, 530 460 L 515 520 C 510 540, 490 560, 480 610 L 320 610 C 310 560, 290 540, 285 520 L 270 460 C 260 440, 235 415, 230 380 Z" />
  </g>

  <!-- Circuit lines across cranium -->
  <g fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8">
    <path d="M 400 160 L 400 300 L 450 340 L 450 380" />
    <path d="M 400 240 L 340 280 L 340 350" />
    <path d="M 310 200 L 310 240 L 260 270" />
    <path d="M 490 200 L 490 240 L 540 270" />
  </g>

  <!-- Tech nodes -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="400" cy="240" r="4" />
    <circle cx="450" cy="340" r="3" />
    <circle cx="340" cy="280" r="3" />
    <circle cx="310" cy="240" r="3" />
    <circle cx="490" cy="240" r="3" />
  </g>

  <!-- Eye Sockets with HUD Targeters -->
  <g stroke="#00f0ff" stroke-width="2.5" fill="#082f49" filter="url(#glow)">
    <!-- Left eye -->
    <polygon points="280,360 360,370 350,440 290,430" />
    <!-- Right eye -->
    <polygon points="520,360 440,370 450,440 510,430" />
  </g>

  <!-- Glowing pupils / sensors -->
  <circle cx="320" cy="400" r="10" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="320" cy="400" r="22" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8 4"/>
  <circle cx="480" cy="400" r="10" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="480" cy="400" r="22" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8 4"/>

  <!-- Nasal cavity -->
  <polygon points="400,430 415,480 385,480" fill="#00f0ff" opacity="0.8" />

  <!-- Jaw and Teeth Structure -->
  <g stroke="#22d3ee" stroke-width="2" fill="#0369a1" opacity="0.8">
    <rect x="330" y="530" width="24" height="35" rx="3" />
    <rect x="360" y="530" width="24" height="38" rx="3" />
    <rect x="390" y="530" width="20" height="40" rx="3" />
    <rect x="416" y="530" width="24" height="38" rx="3" />
    <rect x="446" y="530" width="24" height="35" rx="3" />

    <!-- Lower teeth -->
    <rect x="340" y="575" width="22" height="28" rx="3" fill="#0284c7"/>
    <rect x="368" y="575" width="22" height="30" rx="3" fill="#0284c7"/>
    <rect x="396" y="575" width="22" height="30" rx="3" fill="#0284c7"/>
    <rect x="424" y="575" width="22" height="28" rx="3" fill="#0284c7"/>
  </g>

  <!-- Crosshairs and HUD tags -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.7">
    <circle cx="400" cy="400" r="320" fill="none" stroke-dasharray="10 30" />
    <line x1="200" y1="400" x2="220" y2="400" />
    <line x1="580" y1="400" x2="600" y2="400" />
    <line x1="400" y1="120" x2="400" y2="140" />
    <line x1="400" y1="640" x2="400" y2="660" />
  </g>

  <text x="400" y="720" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="14" letter-spacing="8">CYBERNETIC CHASSIS // MK-VIII</text>
  <text x="400" y="745" text-anchor="middle" fill="#0284c7" font-family="monospace" font-size="11" letter-spacing="4">CRANIAL BIOMETRIC TELEMETRY: ACTIVE</text>
</svg>
